[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4i-predictive-maintenance"
version = "0.1.0"
description = "Local machine-failure prediction with the AI4I 2020 dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
maintenance-ml = "predictive_maintenance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
